# Ground segment of the MCSR paper (Du et al., IEEE TMC 2025, Sec. VI-B): the 100 most populous cities
# of the world as ground stations. City list and coordinates: Hypatia (snkas/hypatia),
#   ground_stations_cities_sorted_by_estimated_2025_pop_top_100.basic.txt  (station[i] = line i of that file).
# Included from a [Config ...] section (see PaperS1 in scenarios.ini); it replaces the DSN/ESTRACK/mobile set.
**.nrOfGS = 100
*.station[*].nodeType = "station"
# the base config makes station[9..12] moving ships/aircraft: undo that for the city stations
*.station[9..12].mobility.route = ""
*.station[9..12].mobility.speed = 0mps
*.station[9..12].mobility.routeStart = 0
*.station[9..12].mobility.altitudeKm = 0


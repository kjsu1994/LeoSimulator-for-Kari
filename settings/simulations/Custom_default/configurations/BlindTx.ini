# =============================================================================
# This file defines the configurations for the BlindTx scheme, which simulates the behavior 
# of devices that transmit without receiving any acknowledgments or feedback from the satellite. 
# =============================================================================


# -----------------------------------------------------------------------------
# BlindTx Configurations
# -----------------------------------------------------------------------------
[Config BlindKineis]
abstract = true
#--------------- Transmit windows ---------------   
**.ttwDuration = 180s                           # Duration of the transmission window
**.ttwIdle = 0s                               	# Idle time between transmission windows
# **.Ntw =  ${Ntw = 1..15} 		    			# Number of transmission windows
**.Ntw = 10
#--------------- UL transmit ---------------
**.ttxStart_min = 0s                            # Minimum time to start first transmission
**.ttxStart_max = 0s                            # Maximum time to start first transmission
**.ttxIdle_min = 0s                            	# Minimum idle time between transmissions
**.ttxIdle_max = 0s                           	# Maximum idle time between transmissions
# **.Ntx = ${Ntx = 1,2,3}                       # Number of uplink transmissions
**.Ntx = 1

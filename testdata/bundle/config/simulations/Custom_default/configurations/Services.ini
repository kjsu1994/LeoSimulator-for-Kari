# =============================================================================
# This file defines the different message generation configurations used in the simulations.
# =============================================================================


# -----------------------------------------------------------------------------
# Service Configuration
# -----------------------------------------------------------------------------
[Config ServiceEverySecond]
abstract = true
**.timeToFirstPacket = intuniform(0s, 0s)       # Time to first packet generation
**.timeToNextPacket = intuniform(1s, 1s)      # Time to next packet generation

[Config ServiceEveryMinute]
abstract = true
**.timeToFirstPacket = intuniform(0s, 0s)       # Time to first packet generation
**.timeToNextPacket = intuniform(60s, 60s)      # Time to next packet generation

[Config ServiceExponential1800s]
abstract = true
**.timeToFirstPacket = intuniform(0s, 0s)       # Time to first packet generation
**.timeToNextPacket = exponential(1800s)      # Time to next packet generation

[Config ServiceHourlyCustom]
abstract = true
**.timeToFirstPacket = 540s      # Time to first packet generation
**.timeToNextPacket = 3600s       # Time to next packet generation

# 24 messages per day
[Config ServiceEveryHour]
abstract = true
**.timeToFirstPacket = 0s      # Time to first packet generation
**.timeToNextPacket = 3600s       # Time to next packet generation

# 48 messages per day
[Config ServiceDoubleBiHourly]
abstract = true
**.timeToFirstPacket = 0s      # Time to first packet generation
**.timeToNextPacket = 1800s       # Time to next packet generation

# randomly 1 message per day
[Config ServiceDaily]
abstract = true
**.timeToFirstPacket = intuniform(0s, 0s)       # Time to first packet generation
**.timeToNextPacket = exponential(86400s)       # Time to next packet generation

[Config ServiceUnique]
abstract = true
**.timeToFirstPacket = 0s
**.timeToNextPacket = 604800s

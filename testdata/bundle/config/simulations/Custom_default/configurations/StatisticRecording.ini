# =============================================================================
# Ordered from most specific to most global.
# OMNeT++ applies the first matching rule, so fine-grained overrides must
# appear before broader wildcard patterns.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Named signals / statistics (most specific — individual stat names)
# -----------------------------------------------------------------------------
# Radio state transitions
**.radioMode.result-recording-modes = -
**.receptionState.result-recording-modes = -
**.transmissionState.result-recording-modes = -

# Link quality / decoding quality
**.minSnir.result-recording-modes = -
**.packetErrorRate.result-recording-modes = -
**.bitErrorRate.result-recording-modes = -
**.symbolErrorRate.result-recording-modes = -

# Custom/LoRa reception outcome signals
**.LoRaReceptionCollision.result-recording-modes = -
**.LoRaTransmissionCreated.result-recording-modes = -
**.Sat_Dsl_Phy_CustomRadioReceptionStarted.result-recording-modes = -
**.Sat_Dsl_Phy_CustomRadioReceptionFinishedCorrect.result-recording-modes = -
**.Sat_Dsl_Phy_CustomRadioReceptionFinishedIgnoring.result-recording-modes = -
**.LoRaGWRadioReceptionStarted.result-recording-modes = -
**.LoRaGWRadioReceptionFinishedCorrect.result-recording-modes = -

# Traffic / routing counters
**.packetsReceived.result-recording-modes = count
**.packetsSent.result-recording-modes = count
**.packetsDropped.result-recording-modes = count

# Custom receiver + routing drop counters recorded via recordScalar
**.numCollisions.scalar-recording = true
**.numCN0Failures.scalar-recording = true
**.rcvBelowSensitivity.scalar-recording = false
**.droppedMaxHop.scalar-recording = false
**.droppedFullQueue.scalar-recording = false
**.droppedIfDown.scalar-recording = false
**.droppedNoRoute.scalar-recording = false

# -----------------------------------------------------------------------------
# 2. Specific sub-module paths (medium internals, energy, topology)
# -----------------------------------------------------------------------------
# CustomPHYPathLoss / CustomPHYAnalogModel / CustomMedium cOutVectors
**.radioMedium.pathLoss.**.vector-recording = false
**.radioMedium.analogModel.**.vector-recording = false
**.radioMedium.**.vector-recording = false

# Energy consumer
**.radio.energyConsumer.**.scalar-recording = true
**.radio.energyConsumer.**.vector-recording = true

# Topology control
**.topologyControl.**.scalar-recording = true
**.topologyControl.**.vector-recording = true


# -----------------------------------------------------------------------------
# 3. OSI layer modules (medium specificity)
# -----------------------------------------------------------------------------
# PHY / Radio
**.phy*.**.scalar-recording = true
**.phy*.**.vector-recording = false

# Data-link / MAC
**.dlk.**.scalar-recording = true
**.dlk.**.vector-recording = true
**.mac.**.scalar-recording = true
**.mac.**.vector-recording = true

# Network layer — satellite-specific path before generic **.net.**
**.satellite[*].net.**.scalar-recording = true
**.satellite[*].net.**.vector-recording = true
**.net.**.scalar-recording = true
**.net.**.vector-recording = true


# -----------------------------------------------------------------------------
# 4. Node-level module toggles (broad — covers all sub-modules of a node)
# -----------------------------------------------------------------------------
# Terminal node modules
**.terminal[*].**.scalar-recording = true
**.terminal[*].**.vector-recording = true

# Satellite node modules
**.satellite[*].**.scalar-recording = true
**.satellite[*].**.vector-recording = false

# Station node modules
**.station[*].**.scalar-recording = true
**.station[*].**.vector-recording = true

# Optional server modules (if present in selected scenario)
**.server[*].**.scalar-recording = true
**.server[*].**.vector-recording = true


# -----------------------------------------------------------------------------
# 5. Global defaults (least specific — catch-all fallback)
# -----------------------------------------------------------------------------
**.result-recording-modes = -
**.statistic-recording = true
**.scalar-recording = true
**.vector-recording = true
#**.vector-record-eventnumbers = false 